<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>香农芯创 · 海力士相似度追踪</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;padding:0;min-height:100vh}
.header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:24px 20px 16px;border-bottom:1px solid #334155}
.header h1{font-size:20px;font-weight:700;color:#f1f5f9;display:flex;align-items:center;gap:8px}
.header .sub{font-size:12px;color:#64748b;margin-top:4px}
.header .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;margin-left:8px}
.badge.on{background:#166534;color:#86efac}
.badge.off{background:#7f1d1d;color:#fca5a5}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px;background:#1e293b;border-bottom:1px solid #334155}
.stat-item{text-align:center}
.stat-item .label{font-size:10px;color:#64748b;text-transform:uppercase}
.stat-item .val{font-size:16px;font-weight:700;margin-top:2px}
.green{color:#22c55e}.red{color:#ef4444}.orange{color:#f59e0b}.blue{color:#3b82f6}.purple{color:#a855f7}
.card{background:#1e293b;border-radius:12px;margin:12px 16px;padding:16px;border:1px solid #334155}
.card h3{font-size:13px;color:#94a3b8;margin-bottom:12px;font-weight:600}
.chart{height:300px;width:100%}
.chart-sm{height:200px;width:100%}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.lag-bar{display:flex;align-items:center;gap:6px;padding:4px 0}
.lag-bar .bar-wrap{flex:1;height:16px;background:#334155;border-radius:3px;overflow:hidden}
.lag-bar .bar-fill{height:100%;border-radius:3px;transition:width 0.3s}
.lag-label{font-size:11px;color:#94a3b8;min-width:60px}
.lag-val{font-size:11px;font-weight:600;min-width:44px;text-align:right}
table{width:100%;font-size:12px;border-collapse:collapse}
th{text-align:left;padding:6px 8px;color:#64748b;border-bottom:1px solid #334155;font-weight:500}
td{padding:6px 8px;border-bottom:1px solid #1e293b}
.refresh-btn{position:fixed;bottom:20px;right:20px;background:#3b82f6;color:#fff;border:none;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(59,130,246,0.4);z-index:100}
.refresh-btn:active{transform:scale(0.95)}
.ts{font-size:10px;color:#475569;text-align:center;padding:8px}
@media(max-width:420px){.stats-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="header">
<h1>🔄 香农芯创 · 实时相似度</h1>
<div class="sub">香农芯创 (300475) vs SK海力士 (000660.KS) <span id="statusBadge" class="badge on">实时</span></div>
</div>

<div class="stats-row">
<div class="stat-item"><div class="label">香农芯创</div><div class="val" id="xnPrice">--</div></div>
<div class="stat-item"><div class="label">SK海力士</div><div class="val" id="skPrice">--</div></div>
<div class="stat-item"><div class="label">60日滚动r</div><div class="val blue" id="rollR">--</div></div>
<div class="stat-item"><div class="label">RSI-14</div><div class="val" id="rsiVal">--</div></div>
</div>

<div class="card">
<h3>📈 价格走势对比</h3>
<div id="chartPrice" class="chart"></div>
</div>

<div class="card">
<h3>📊 滚动60日相关性</h3>
<div id="chartRoll" class="chart"></div>
</div>

<div class="card">
<h3>⏱ 滞后相关性 (N日)</h3>
<p style="font-size:11px;color:#64748b;margin-bottom:12px">正值 = SK今日 与 香农N日后 同向变动</p>
<div id="lagChart" class="chart-sm"></div>
</div>

<div class="card">
<h3>📋 技术指标</h3>
<div class="grid-2" id="techGrid"></div>
</div>

<button class="refresh-btn" onclick="location.reload()">↻</button>
<div class="ts" id="updateTime">加载中...</div>

<script>
function load() {
    fetch('/api/xn')
        .then(r => r.json())
        .then(d => {
            if (d.error) { document.getElementById('updateTime').textContent = '❌ ' + d.error; return }
            const s = d.stats

            document.getElementById('xnPrice').textContent = s.close.toFixed(2)
            document.getElementById('xnPrice').className = 'val ' + (s.change_pct >= 0 ? 'green' : 'red')
            document.getElementById('skPrice').textContent = s.sk_close.toLocaleString()
            document.getElementById('skPrice').className = 'val ' + (s.sk_change_pct >= 0 ? 'green' : 'red')
            document.getElementById('rollR').textContent = s.rolling_corr_last.toFixed(4)
            document.getElementById('rsiVal').textContent = s.rsi14.toFixed(1)
            document.getElementById('rsiVal').className = 'val ' + (s.rsi14 < 30 ? 'red' : s.rsi14 > 70 ? 'orange' : 'green')
            document.getElementById('statusBadge').textContent = '✅ ' + new Date().toLocaleTimeString()

            // Tech indicators
            document.getElementById('techGrid').innerHTML = `
                <div class="stat-item"><div class="label">MA5</div><div class="val">${s.ma5.toFixed(1)}</div></div>
                <div class="stat-item"><div class="label">MA20</div><div class="val">${s.ma20.toFixed(1)}</div></div>
                <div class="stat-item"><div class="label">MA60</div><div class="val">${s.ma60.toFixed(1)}</div></div>
                <div class="stat-item"><div class="label">MACD柱</div><div class="val ${s.macd_hist >= 0 ? 'green' : 'red'}">${s.macd_hist.toFixed(2)}</div></div>
                <div class="stat-item"><div class="label">同期r</div><div class="val blue">${s.correlation}</div></div>
                <div class="stat-item"><div class="label">滚动r均值</div><div class="val blue">${s.rolling_corr_mean}</div></div>
                <div class="stat-item"><div class="label">滚动r最高</div><div class="val green">${s.rolling_corr_max}</div></div>
                <div class="stat-item"><div class="label">滚动r最低</div><div class="val red">${s.rolling_corr_min}</div></div>
            `

            // Price chart
            const ch1 = echarts.init(document.getElementById('chartPrice'))
            const xnDates = d.xn_prices.map(p => p.date)
            const xnCloses = d.xn_prices.map(p => p.close)
            const skAligned = d.sk_prices.filter(p => xnDates.includes(p.date))
            const skCloses = skAligned.map(p => {
                const idx = xnDates.indexOf(p.date)
                return { value: p.close, idx: idx }
            })
            // Normalize both to 100
            const xnBase = xnCloses[0]
            const skBase = d.sk_prices[d.sk_prices.length - xnCloses.length]?.close || d.sk_prices[0].close
            const xnNorm = xnCloses.map(v => v / xnBase * 100)
            const skNorm = skAligned.map(p => p.close / (d.sk_prices[d.sk_prices.length - xnCloses.length]?.close || d.sk_prices[0].close) * 100)

            ch1.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['香农芯创','SK海力士'], textStyle: { color: '#94a3b8' }, top: 0 },
                grid: { left: '10%', right: '6%', top: '18%', bottom: '12%' },
                xAxis: { type: 'category', data: xnDates, axisLabel: { fontSize: 9, color: '#64748b', interval: 25 } },
                yAxis: { type: 'value', name: '归一化(基准=100)', nameTextStyle: { color: '#64748b', fontSize: 10 }, splitLine: { lineStyle: { color: '#1e293b' } } },
                dataZoom: [{ type: 'inside' }],
                series: [
                    { name:'香农芯创', type:'line', data:xnNorm.map(v=>+v.toFixed(2)), smooth:true, lineStyle:{color:'#22c55e',width:2}, areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(34,197,94,0.2)'},{offset:1,color:'rgba(34,197,94,0)'}]}} },
                    { name:'SK海力士', type:'line', data:skNorm.map(v=>+v.toFixed(2)), smooth:true, lineStyle:{color:'#3b82f6',width:2}, areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(59,130,246,0.2)'},{offset:1,color:'rgba(59,130,246,0)'}]}} }
                ]
            })
            ch1.resize()
            window.addEventListener('resize', ()=>ch1.resize())

            // Rolling correlation chart
            const ch2 = echarts.init(document.getElementById('chartRoll'))
            const rc = d.rolling_corr
            ch2.setOption({
                tooltip: { trigger: 'axis', formatter: p => `${p[0].axisValue}<br/>r=${p[0].value}` },
                grid: { left: '10%', right: '6%', top: '8%', bottom: '12%' },
                xAxis: { type: 'category', data: rc.map(x=>x.date), axisLabel: { fontSize: 9, color:'#64748b', interval: 25 } },
                yAxis: { type: 'value', min: -0.4, max: 0.8, splitLine: { lineStyle: { color: '#1e293b' } } },
                dataZoom: [{ type: 'inside' }],
                visualMap: { show: false, pieces: [{ min: 0.3, color: '#22c55e' }, { min: -0.3, max: 0.3, color: '#f59e0b' }, { max: -0.3, color: '#ef4444' }] },
                series: [{ type:'line', data:rc.map(x=>x.r), smooth:true, areaStyle:{opacity:0.1}, lineStyle:{color:'#3b82f6',width:2}, markLine:{data:[{yAxis:0}],silent:true,lineStyle:{type:'dashed',color:'#475569'}}} ]
            })
            ch2.resize()
            window.addEventListener('resize', ()=>ch2.resize())

            // Lag chart
            const ch3 = echarts.init(document.getElementById('lagChart'))
            const skL = d.lagged_corr_sk_lead
            const xnL = d.lagged_corr_xn_lead
            ch3.setOption({
                tooltip: { trigger: 'axis', formatter: p => {
                    let h = `<b>滞后${p[0].axisValue}天</b><br/>`
                    p.forEach(i => { h += `${i.seriesName}: r=${i.value}<br/>` })
                    return h
                }},
                legend: { data: ['SK→香农','香农→SK'], textStyle: { color: '#94a3b8', fontSize: 10 }, top: 0 },
                grid: { left: '6%', right: '6%', top: '20%', bottom: '8%' },
                xAxis: { type: 'category', data: skL.map(x=>x.lag+'d'), axisLabel: { fontSize: 9, color:'#64748b' } },
                yAxis: { type: 'value', min: -0.15, max: 0.2, splitLine: { lineStyle: { color: '#1e293b' } } },
                series: [
                    { name:'SK→香农', type:'bar', data:skL.map(x=>({value:x.r,itemStyle:{color:x.r>=0?'#3b82f6':'#ef4444'}})), barWidth:'35%' },
                    { name:'香农→SK', type:'bar', data:xnL.map(x=>({value:x.r,itemStyle:{color:x.r>=0?'#22c55e':'#ef4444'}})), barWidth:'35%' }
                ]
            })
            ch3.resize()
            window.addEventListener('resize', ()=>ch3.resize())

            document.getElementById('updateTime').textContent = '更新: ' + new Date().toLocaleString()
        })
        .catch(e => { document.getElementById('updateTime').textContent = '❌ 加载失败: ' + e.message })
}

load()
setInterval(load, 60000)
</script>
</body>
</html>
