services:
  - type: web
    name: hynix-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: YEREN_DB
        value: yeren.db
      - key: PYTHON_VERSION
        value: 3.13.12
